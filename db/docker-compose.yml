services:
  mysql:
    image: mysql:8.4
    container_name: beshow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: beshow
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - beshow_mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  beshow_mysql_data:
